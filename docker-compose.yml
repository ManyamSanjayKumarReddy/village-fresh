services:
  postgres:
    image: postgres:16-alpine
    container_name: village-fresh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: village_fresh
    ports:
      - "5440:5432"
    volumes:
      - village-fresh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  village-fresh-postgres-data:
